name: check

# Builds Charon, both Aeneas checkouts (pristine pin and the fork in
# aeneas_mod) and the Aeneas Lean library, then runs tools/check.py on every
# input in tests/expected.json and compares the verdicts.
#
# Caching:
# - Most Nix dependencies come from cache.nixos.org and upstream's public
#   Cachix cache (hacl). The expensive derivations (Charon, the Rust toolchain
#   and MIR sysroots, both Aeneas binaries) are not in hacl as we build them,
#   so after a build we export the closures of the three results to a local
#   file binary cache and save that with actions/cache, keyed on the three
#   submodule commits. A later run adds it as a substituter and only builds
#   what changed. (A whole-/nix/store cache was tried first: 20 GB, GC'd to
#   fit, and restored with errors, so everything was rebuilt anyway.)
# - The Lean toolchain (~/.elan) and the built Aeneas Lean library + Mathlib
#   (aeneas/backends/lean/.lake) are cached, keyed on the Aeneas commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # Mathlib's build cache plus the Rust and OCaml toolchains need more
        # than the ~14 GB a hosted runner has free.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Record pins
        id: pins
        run: |
          echo "aeneas=$(git -C aeneas rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "aeneas_mod=$(git -C aeneas_mod rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "charon=$(git -C charon rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test "$(grep -v '^#' aeneas/charon-pin | head -1)" = "$(git -C charon rev-parse HEAD)" \
            || { echo "charon/ is not at aeneas/charon-pin"; exit 1; }

      # ------------------------------------------------------------ Nix builds

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=

      - name: Restore Nix binary cache of previous results
        id: nix-cache
        uses: actions/cache@v4
        with:
          path: /tmp/nix-cache
          key: nixcache-${{ runner.os }}-${{ steps.pins.outputs.charon }}-${{ steps.pins.outputs.aeneas }}-${{ steps.pins.outputs.aeneas_mod }}
          restore-keys: |
            nixcache-${{ runner.os }}-${{ steps.pins.outputs.charon }}-${{ steps.pins.outputs.aeneas }}-
            nixcache-${{ runner.os }}-${{ steps.pins.outputs.charon }}-
            nixcache-${{ runner.os }}-

      - name: Build Charon and Aeneas (pristine, mod)
        run: |
          # Use the restored file cache as a substituter, if any. Its paths are
          # unsigned; `trusted=1` on the store URL lets the daemon take them
          # (`--option require-sigs false` is not honoured for substitution).
          subst=""
          if [ -f /tmp/nix-cache/nix-cache-info ]; then
            subst="--extra-substituters file:///tmp/nix-cache?trusted=1"
            echo "using restored binary cache ($(ls /tmp/nix-cache/*.narinfo 2>/dev/null | wc -l) narinfos)"
          fi
          # Charon at the pin comes from the Aeneas flake (its flake.lock pins
          # the same commit as aeneas/charon-pin).
          nix build -L $subst "path:$PWD/aeneas#charon" -o result-charon
          nix build -L $subst "path:$PWD/aeneas#aeneas" -o result-aeneas
          nix build -L $subst "path:$PWD/aeneas_mod#aeneas" -o result-aeneas-mod
          # tools/check.py looks for <checkout>/bin/{charon,aeneas}.
          mkdir -p charon/bin aeneas/bin aeneas_mod/bin
          ln -sf "$PWD"/result-charon/bin/* charon/bin/
          ln -sf "$PWD"/result-aeneas/bin/aeneas aeneas/bin/aeneas
          ln -sf "$PWD"/result-aeneas-mod/bin/aeneas aeneas_mod/bin/aeneas
          charon/bin/charon version || true
          charon/bin/charon toolchain-version
          df -h /

      - name: Export result closures to the binary cache
        if: steps.nix-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/nix-cache
          nix copy --to "file:///tmp/nix-cache?compression=zstd" \
            "$(readlink -f result-charon)" "$(readlink -f result-aeneas)" "$(readlink -f result-aeneas-mod)"
          du -sh /tmp/nix-cache
          ls /tmp/nix-cache/*.narinfo | wc -l

      # ------------------------------------------------------------ Lean library

      - name: Restore Lean toolchain and Aeneas Lean library
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            aeneas/backends/lean/.lake
          key: lean-${{ runner.os }}-${{ steps.pins.outputs.aeneas }}-${{ hashFiles('aeneas/backends/lean/lean-toolchain', 'aeneas/backends/lean/lake-manifest.json') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the Aeneas Lean library
        if: steps.lean-cache.outputs.cache-hit != 'true'
        working-directory: aeneas/backends/lean
        run: |
          lake exe cache get
          lake build
          df -h /

      # ------------------------------------------------------------ Checks

      - name: Expected verdicts (pristine and mod)
        run: python3 tests/run_expected.py
